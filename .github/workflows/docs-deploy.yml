name: Deploy Docs to GitHub Pages

on:
  push:
    branches:
      - custom/main
    paths:
      - 'project-analysis/**'
      - 'docs-site/scripts/**'
      - 'docs-site/requirements.txt'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r docs-site/requirements.txt

      - name: Generate docs config
        run: python docs-site/scripts/generate_config.py

      - name: Deploy to GitHub Pages
        run: |
          cd docs-site
          mkdocs gh-deploy --force --config-file mkdocs.yml
