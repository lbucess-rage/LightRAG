[project]
name = "integrated-kms-admin"
version = "0.1.0"
description = "Integrated KMS admin and search gateway for LightRAG"
requires-python = ">=3.10"
dependencies = [
    "asyncpg>=0.29.0",
    "bcrypt>=4.0.0",
    "fastapi>=0.110.0",
    "httpx>=0.28.1",
    "PyJWT>=2.8.0,<3.0.0",
    "python-multipart>=0.0.9",
    "uvicorn>=0.27.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.8.0",
]

[project.scripts]
kms-admin-server = "kms_admin.app:main"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
